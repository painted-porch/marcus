[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marcus-runner"
version = "0.1.0"
description = "The run-side toolkit Marcus extensions share: a server under test, seeding, run guards, the cost watchdog, the board sampler, measures and the run record (issue #914)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
marcus-runner-watchdog = "marcus_runner.watchdog:main"
marcus-runner-sampler = "marcus_runner.sampler:main"
marcus-runner-hash = "marcus_runner.integrity:main"

[tool.setuptools]
packages = ["marcus_runner"]
