<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Condition A: an excerpt goes to an answer engine and the answer is graded. Condition B: the excerpt becomes a case on the record with a find task from vendor X, a verify task from a different vendor Y, a sampled approval by a person, and a graded answer or a decline." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.bg{fill:#F2F3EE}
.n{fill:#F2F3EE;stroke:#4A524D;stroke-width:1.2}.n2{fill:#E9EBE4;stroke:#737B76;stroke-width:1}
.nacc{fill:#EDE6D2;stroke:#A97B1F;stroke-width:1.6}.ndash{fill:#F2F3EE;stroke:#737B76;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1C221F;font-family:Georgia,'Times New Roman',serif;font-size:13px}.tb{font-weight:600}
.tm{fill:#737B76;font-family:Menlo,Consolas,monospace;font-size:11px}.tacc{fill:#7E5A12}
.ln{stroke:#4A524D;stroke-width:1.2;fill:none}.lnacc{stroke:#A97B1F;stroke-width:1.8;fill:none}.bus{stroke:#A97B1F;stroke-width:2.4;fill:none}
.mk{fill:#4A524D}.mkacc{fill:#A97B1F}
</style><rect class="bg" x="0" y="0" width="900" height="300"/>
<defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<defs><marker id="a6acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkacc"/></marker></defs>
<text x="16" y="26" class="tm" letter-spacing="1">CONDITION A · ENGINE ALONE</text>
<rect x="16" y="40" width="100" height="44" rx="3" class="n"/><text x="66.0" y="66.0" class="t tb" text-anchor="middle" font-size="12">Excerpt</text>
<rect x="166" y="40" width="150" height="44" rx="3" class="n"/><text x="241.0" y="66.0" class="t tb" text-anchor="middle" font-size="12">Answer engine</text>
<rect x="366" y="40" width="150" height="44" rx="3" class="n"/><text x="441.0" y="66.0" class="t tb" text-anchor="middle" font-size="12">Answer, graded</text>
<line x1="116" y1="62" x2="164" y2="62" class="ln" marker-end="url(#a6)"/><line x1="316" y1="62" x2="364" y2="62" class="ln" marker-end="url(#a6)"/>
<text x="16" y="108" class="tm" font-size="10.5">asked for headline, publisher, date, and URL; graded with the six Tow categories; the engines rarely decline</text>
<text x="16" y="150" class="tm" letter-spacing="1">CONDITION B · ON THE RECORD</text>
<rect x="16" y="180" width="100" height="44" rx="3" class="n"/><text x="66.0" y="206.0" class="t tb" text-anchor="middle" font-size="12">Excerpt</text>
<rect x="150" y="180" width="130" height="44" rx="3" class="n"/><text x="215.0" y="199" class="t tb" text-anchor="middle" font-size="12">find</text><text x="215.0" y="215" class="tm" text-anchor="middle" font-size="9.5">vendor X</text>
<rect x="316" y="180" width="170" height="44" rx="3" class="nacc"/><text x="401.0" y="199" class="t tb" text-anchor="middle" font-size="12">verify</text><text x="401.0" y="215" class="tm" text-anchor="middle" font-size="9.5">vendor Y, and Y ≠ X</text>
<rect x="522" y="180" width="150" height="44" rx="3" class="ndash"/><text x="597.0" y="199" class="t tb" text-anchor="middle" font-size="12">approve</text><text x="597.0" y="215" class="tm" text-anchor="middle" font-size="9.5">a person, 10% sample</text>
<rect x="708" y="180" width="176" height="44" rx="3" class="n"/><text x="796.0" y="199" class="t tb" text-anchor="middle" font-size="12">Answer or declined</text><text x="796.0" y="215" class="tm" text-anchor="middle" font-size="9.5">graded the same way</text>
<line x1="116" y1="202" x2="148" y2="202" class="ln" marker-end="url(#a6)"/>
<line x1="280" y1="202" x2="314" y2="202" class="lnacc" marker-end="url(#a6acc)"/><text x="297" y="172" class="tm tacc" font-size="10" text-anchor="middle">claim</text>
<line x1="486" y1="202" x2="520" y2="202" class="ln" marker-end="url(#a6)"/><text x="503" y="172" class="tm" font-size="10" text-anchor="middle">verdict</text>
<line x1="672" y1="202" x2="706" y2="202" class="ln" marker-end="url(#a6)"/><text x="689" y="172" class="tm" font-size="10" text-anchor="middle">close</text>
<text x="401" y="244" class="tm tacc" font-size="10.5" text-anchor="middle">fetches the URL · matches the excerpt · checks publisher and date</text>
<line x1="150" y1="262" x2="884" y2="262" class="lnacc"/><line x1="150" y1="256" x2="150" y2="262" class="lnacc"/><line x1="884" y1="256" x2="884" y2="262" class="lnacc"/>
<text x="517" y="282" class="tm" text-anchor="middle">every step on the record: owner, lease, evidence, cost, timestamps</text>
</svg>
