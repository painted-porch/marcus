<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="An existing engineering pipeline (ticket, spec, agent implements, CI, review, merge, deploy) with the record interjected at three moments: when the task is handed to an agent, when the agent says it is done, and when a person signs off." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.bg{fill:#F2F3EE}
.n{fill:#F2F3EE;stroke:#4A524D;stroke-width:1.2}.n2{fill:#E9EBE4;stroke:#737B76;stroke-width:1}
.nacc{fill:#EDE6D2;stroke:#A97B1F;stroke-width:1.6}.ndash{fill:#F2F3EE;stroke:#737B76;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1C221F;font-family:Georgia,'Times New Roman',serif;font-size:13px}.tb{font-weight:600}
.tm{fill:#737B76;font-family:Menlo,Consolas,monospace;font-size:11px}.tacc{fill:#7E5A12}
.ln{stroke:#4A524D;stroke-width:1.2;fill:none}.lnacc{stroke:#A97B1F;stroke-width:1.8;fill:none}.bus{stroke:#A97B1F;stroke-width:2.4;fill:none}
.mk{fill:#4A524D}.mkacc{fill:#A97B1F}
</style><rect class="bg" x="0" y="0" width="900" height="250"/>
<defs><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<defs><marker id="a7acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkacc"/></marker></defs>
<rect x="16" y="40" width="104" height="44" rx="3" class="n"/>
<text x="68.0" y="67" class="t tb" text-anchor="middle" font-size="12">Ticket</text>
<line x1="120" y1="62" x2="138" y2="62" class="ln" marker-end="url(#a7)"/>
<rect x="140" y="40" width="104" height="44" rx="3" class="n"/>
<text x="192.0" y="67" class="t tb" text-anchor="middle" font-size="12">Spec</text>
<line x1="244" y1="62" x2="262" y2="62" class="ln" marker-end="url(#a7)"/>
<rect x="264" y="40" width="104" height="44" rx="3" class="n"/>
<text x="316.0" y="67" class="t tb" text-anchor="middle" font-size="12">Agent implements</text>
<line x1="368" y1="62" x2="386" y2="62" class="ln" marker-end="url(#a7)"/>
<rect x="388" y="40" width="104" height="44" rx="3" class="n"/>
<text x="440.0" y="67" class="t tb" text-anchor="middle" font-size="12">CI</text>
<line x1="492" y1="62" x2="510" y2="62" class="ln" marker-end="url(#a7)"/>
<rect x="512" y="40" width="104" height="44" rx="3" class="n"/>
<text x="564.0" y="67" class="t tb" text-anchor="middle" font-size="12">Review</text>
<line x1="616" y1="62" x2="634" y2="62" class="ln" marker-end="url(#a7)"/>
<rect x="636" y="40" width="104" height="44" rx="3" class="n"/>
<text x="688.0" y="67" class="t tb" text-anchor="middle" font-size="12">Merge</text>
<line x1="740" y1="62" x2="758" y2="62" class="ln" marker-end="url(#a7)"/>
<rect x="760" y="40" width="104" height="44" rx="3" class="n"/>
<text x="812.0" y="67" class="t tb" text-anchor="middle" font-size="12">Deploy</text>
<text x="16" y="26" class="tm" letter-spacing="1">THE PROCESS THE TEAM ALREADY RUNS</text>
<rect x="140" y="176" width="600" height="50" rx="4" class="nacc"/>
<text x="440.0" y="197" class="t tb tacc" text-anchor="middle" font-size="13">The record</text>
<text x="440.0" y="215" class="tm" text-anchor="middle" font-size="10.5">case · tasks · leases · evidence · approvals · cost</text>
<line x1="316.0" y1="176" x2="316.0" y2="88" class="lnacc" marker-end="url(#a7acc)"/>
<text x="324.0" y="112" class="tm tacc" text-anchor="start" font-size="10.5">hands the task,</text>
<text x="324.0" y="126" class="tm tacc" text-anchor="start" font-size="10.5">starts a lease</text>
<line x1="502.0" y1="176" x2="502.0" y2="88" class="lnacc" marker-end="url(#a7acc)"/>
<text x="510.0" y="112" class="tm tacc" text-anchor="start" font-size="10.5">refuses done without evidence;</text>
<text x="510.0" y="126" class="tm tacc" text-anchor="start" font-size="10.5">review never goes to the author</text>
<line x1="688.0" y1="176" x2="688.0" y2="88" class="lnacc" marker-end="url(#a7acc)"/>
<text x="696.0" y="112" class="tm tacc" text-anchor="start" font-size="10.5">approval task,</text>
<text x="696.0" y="126" class="tm tacc" text-anchor="start" font-size="10.5">a person closes it</text>
<text x="16" y="246" class="tm" font-size="10.5">everything else, including the ticket system, the repo, CI, and the review tool, stays exactly where it is</text>
</svg>
