<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 230" role="img" aria-label="Harness board pattern: coding agents pull from the record over MCP and commit to the repo; a person approves merges on the record." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.bg{fill:#F2F3EE}
.n{fill:#F2F3EE;stroke:#4A524D;stroke-width:1.2}.n2{fill:#E9EBE4;stroke:#737B76;stroke-width:1}
.nacc{fill:#EDE6D2;stroke:#A97B1F;stroke-width:1.6}.ndash{fill:#F2F3EE;stroke:#737B76;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1C221F;font-family:Georgia,'Times New Roman',serif;font-size:13px}.tb{font-weight:600}
.tm{fill:#737B76;font-family:Menlo,Consolas,monospace;font-size:11px}.tacc{fill:#7E5A12}
.ln{stroke:#4A524D;stroke-width:1.2;fill:none}.lnacc{stroke:#A97B1F;stroke-width:1.8;fill:none}.bus{stroke:#A97B1F;stroke-width:2.4;fill:none}
.mk{fill:#4A524D}.mkacc{fill:#A97B1F}
</style><rect class="bg" x="0" y="0" width="330" height="230"/>
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<rect x="8" y="20" width="124" height="48" rx="3" class="n"/><text x="70.0" y="39" class="t tb" text-anchor="middle" font-size="12">Coding agents</text><text x="70.0" y="55" class="tm" text-anchor="middle" font-size="9.5">Claude Code · Codex · Gemini</text>
<rect x="150" y="22" width="90" height="44" rx="3" class="nacc"/><text x="195.0" y="48.0" class="t tb" text-anchor="middle" font-size="12">Record</text>
<rect x="256" y="22" width="66" height="44" rx="3" class="n"/><text x="289.0" y="48.0" class="t tb" text-anchor="middle" font-size="12">Person</text>
<rect x="8" y="152" width="124" height="44" rx="3" class="n"/><text x="70.0" y="178.0" class="t tb" text-anchor="middle" font-size="12">Repo and PRs</text>
<line x1="132" y1="44" x2="148" y2="44" class="ln" marker-end="url(#a4)"/><text x="140" y="36" class="tm" font-size="9.5" text-anchor="middle">MCP</text>
<line x1="256" y1="44" x2="242" y2="44" class="ln" marker-end="url(#a4)"/><text x="289" y="86" class="tm" font-size="10" text-anchor="middle">approves merges</text>
<line x1="70" y1="68" x2="70" y2="150" class="ln" marker-end="url(#a4)"/><text x="78" y="112" class="tm" font-size="10">commits</text>
<line x1="195" y1="66" x2="195" y2="174" class="ln" stroke-dasharray="3 3"/><line x1="195" y1="174" x2="134" y2="174" class="ln" stroke-dasharray="3 3" marker-end="url(#a4)"/><text x="200" y="120" class="tm" font-size="10">evidence</text><text x="200" y="133" class="tm" font-size="10">required</text>
</svg>
