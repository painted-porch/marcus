<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Five inputs flow into the system of record (cases, agents, people, identity, cost); inside, a case decomposes into find, verify, approve, and synthesize tasks under four enforced rules; five outputs flow out (deliverable, audit bundle, events, answers, metrics)." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.bg{fill:#F2F3EE}
.n{fill:#F2F3EE;stroke:#4A524D;stroke-width:1.2}.n2{fill:#E9EBE4;stroke:#737B76;stroke-width:1}
.nacc{fill:#EDE6D2;stroke:#A97B1F;stroke-width:1.6}.ndash{fill:#F2F3EE;stroke:#737B76;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1C221F;font-family:Georgia,'Times New Roman',serif;font-size:13px}.tb{font-weight:600}
.tm{fill:#737B76;font-family:Menlo,Consolas,monospace;font-size:11px}.tacc{fill:#7E5A12}
.ln{stroke:#4A524D;stroke-width:1.2;fill:none}.lnacc{stroke:#A97B1F;stroke-width:1.8;fill:none}.bus{stroke:#A97B1F;stroke-width:2.4;fill:none}
.mk{fill:#4A524D}.mkacc{fill:#A97B1F}
</style><rect class="bg" x="0" y="0" width="900" height="430"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<rect x="16" y="22" width="196" height="54" rx="3" class="n"/>
<text x="30" y="44" class="t tb">Cases</text><text x="30" y="63" class="tm">tickets, scripts, apps</text>
<line x1="212" y1="49" x2="274" y2="49" class="ln" marker-end="url(#a2)"/>
<text x="243" y="42" class="tm" text-anchor="middle" font-size="10.5">opens</text>
<rect x="16" y="100" width="196" height="54" rx="3" class="n"/>
<text x="30" y="122" class="t tb">Agents</text><text x="30" y="141" class="tm">harnesses, answer engines</text>
<line x1="212" y1="127" x2="274" y2="127" class="ln" marker-end="url(#a2)"/>
<text x="243" y="120" class="tm" text-anchor="middle" font-size="10.5">pull / report</text>
<rect x="16" y="178" width="196" height="54" rx="3" class="n"/>
<text x="30" y="200" class="t tb">People</text><text x="30" y="219" class="tm">approve, reject, reassign</text>
<line x1="212" y1="205" x2="274" y2="205" class="ln" marker-end="url(#a2)"/>
<text x="243" y="198" class="tm" text-anchor="middle" font-size="10.5">approve</text>
<rect x="16" y="256" width="196" height="54" rx="3" class="n"/>
<text x="30" y="278" class="t tb">Identity</text><text x="30" y="297" class="tm">from the identity layer</text>
<line x1="212" y1="283" x2="274" y2="283" class="ln" marker-end="url(#a2)"/>
<text x="243" y="276" class="tm" text-anchor="middle" font-size="10.5">asserts</text>
<rect x="16" y="334" width="196" height="54" rx="3" class="n"/>
<text x="30" y="356" class="t tb">Cost</text><text x="30" y="375" class="tm">tokens and dollars per task</text>
<line x1="212" y1="361" x2="274" y2="361" class="ln" marker-end="url(#a2)"/>
<text x="243" y="354" class="tm" text-anchor="middle" font-size="10.5">meters</text>
<rect x="688" y="22" width="196" height="54" rx="3" class="n"/>
<text x="702" y="44" class="t tb">Deliverable</text><text x="702" y="63" class="tm">claim by claim, with provenance</text>
<line x1="616" y1="49" x2="686" y2="49" class="ln" marker-end="url(#a2)"/>
<text x="651" y="42" class="tm" text-anchor="middle" font-size="10.5">renders</text>
<rect x="688" y="100" width="196" height="54" rx="3" class="n"/>
<text x="702" y="122" class="t tb">Audit bundle</text><text x="702" y="141" class="tm">JSON export of the case</text>
<line x1="616" y1="127" x2="686" y2="127" class="ln" marker-end="url(#a2)"/>
<text x="651" y="120" class="tm" text-anchor="middle" font-size="10.5">exports</text>
<rect x="688" y="178" width="196" height="54" rx="3" class="n"/>
<text x="702" y="200" class="t tb">Events</text><text x="702" y="219" class="tm">one per transition, to tracing</text>
<line x1="616" y1="205" x2="686" y2="205" class="ln" marker-end="url(#a2)"/>
<text x="651" y="198" class="tm" text-anchor="middle" font-size="10.5">emits</text>
<rect x="688" y="256" width="196" height="54" rx="3" class="n"/>
<text x="702" y="278" class="t tb">Answers</text><text x="702" y="297" class="tm">for governance: who did what</text>
<line x1="616" y1="283" x2="686" y2="283" class="ln" marker-end="url(#a2)"/>
<text x="651" y="276" class="tm" text-anchor="middle" font-size="10.5">answers</text>
<rect x="688" y="334" width="196" height="54" rx="3" class="n"/>
<text x="702" y="356" class="t tb">Metrics</text><text x="702" y="375" class="tm">confident-wrong, $ per claim</text>
<line x1="616" y1="361" x2="686" y2="361" class="ln" marker-end="url(#a2)"/>
<text x="651" y="354" class="tm" text-anchor="middle" font-size="10.5">measures</text>
<rect x="276" y="22" width="340" height="366" rx="4" class="nacc"/>
<text x="296" y="48" class="t tb tacc" font-size="14">System of record</text>
<rect x="296" y="64" width="300" height="34" rx="3" class="n"/><text x="446" y="86" class="t" text-anchor="middle">case · goal · policy</text>
<line x1="446" y1="98" x2="446" y2="122" class="ln" marker-end="url(#a2)"/>
<rect x="296" y="124" width="72" height="34" rx="3" class="n2"/><text x="332" y="146" class="t" text-anchor="middle" font-size="12">find</text>
<rect x="372" y="124" width="72" height="34" rx="3" class="n2"/><text x="408" y="146" class="t" text-anchor="middle" font-size="12">verify</text>
<rect x="448" y="124" width="72" height="34" rx="3" class="n2"/><text x="484" y="146" class="t" text-anchor="middle" font-size="12">approve</text>
<rect x="524" y="124" width="72" height="34" rx="3" class="n2"/><text x="560" y="146" class="t" text-anchor="middle" font-size="12">synthesize</text>
<text x="446" y="184" class="tm" text-anchor="middle">per task: owner + lease · evidence · cost · time</text>
<line x1="296" y1="200" x2="596" y2="200" class="ln" stroke-dasharray="2 3"/>
<text x="296" y="222" class="tm" font-size="10.5" letter-spacing="1">RULES THE BOARD ENFORCES</text>
<text x="296" y="246" class="t" font-size="12.5">eligibility, when an agent asks for work</text>
<text x="296" y="270" class="t" font-size="12.5">evidence, when an agent says it is done</text>
<text x="296" y="294" class="t" font-size="12.5">approval, holding dependents until a person acts</text>
<text x="296" y="318" class="t" font-size="12.5">lease expiry, returning an abandoned task</text>
<text x="296" y="366" class="tm" font-size="10.5">every transition is written once, by the board</text>
</svg>
