<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 230" role="img" aria-label="Engine pattern: a research app opens one case per question; a finder from vendor X and a verifier from a different vendor Y pull from the record; the app receives a memo with provenance." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.bg{fill:#F2F3EE}
.n{fill:#F2F3EE;stroke:#4A524D;stroke-width:1.2}.n2{fill:#E9EBE4;stroke:#737B76;stroke-width:1}
.nacc{fill:#EDE6D2;stroke:#A97B1F;stroke-width:1.6}.ndash{fill:#F2F3EE;stroke:#737B76;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1C221F;font-family:Georgia,'Times New Roman',serif;font-size:13px}.tb{font-weight:600}
.tm{fill:#737B76;font-family:Menlo,Consolas,monospace;font-size:11px}.tacc{fill:#7E5A12}
.ln{stroke:#4A524D;stroke-width:1.2;fill:none}.lnacc{stroke:#A97B1F;stroke-width:1.8;fill:none}.bus{stroke:#A97B1F;stroke-width:2.4;fill:none}
.mk{fill:#4A524D}.mkacc{fill:#A97B1F}
</style><rect class="bg" x="0" y="0" width="330" height="230"/>
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<defs><marker id="a5acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkacc"/></marker></defs>
<rect x="8" y="22" width="110" height="44" rx="3" class="n"/><text x="63.0" y="48.0" class="t tb" text-anchor="middle" font-size="12">Research app</text>
<rect x="150" y="22" width="90" height="44" rx="3" class="nacc"/><text x="195.0" y="48.0" class="t tb" text-anchor="middle" font-size="12">Record</text>
<rect x="8" y="152" width="124" height="44" rx="3" class="n"/><text x="70.0" y="171" class="t tb" text-anchor="middle" font-size="12">Finder</text><text x="70.0" y="187" class="tm" text-anchor="middle" font-size="9.5">vendor X</text>
<rect x="178" y="152" width="144" height="44" rx="3" class="nacc"/><text x="250.0" y="171" class="t tb" text-anchor="middle" font-size="12">Verifier</text><text x="250.0" y="187" class="tm" text-anchor="middle" font-size="9.5">vendor Y, and Y ≠ X</text>
<line x1="118" y1="38" x2="148" y2="38" class="ln" marker-end="url(#a5)"/><line x1="150" y1="52" x2="120" y2="52" class="ln" marker-end="url(#a5)"/>
<text x="79" y="86" class="tm" font-size="10" text-anchor="middle">a case per question ·</text><text x="79" y="100" class="tm" font-size="10" text-anchor="middle">a memo with provenance</text>
<path d="M70,152 V116 H180 V68" class="ln" marker-end="url(#a5)"/>
<path d="M250,152 V116 H210 V68" class="lnacc" marker-end="url(#a5acc)"/>
<text x="125" y="110" class="tm" font-size="10" text-anchor="middle">pull / report</text>
<text x="262" y="126" class="tm tacc" font-size="10">eligibility</text>
</svg>
