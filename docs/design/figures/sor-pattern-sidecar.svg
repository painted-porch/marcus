<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 230" role="img" aria-label="Sidecar pattern: a ticket system opens a case in the record and receives the result; agents pull and report; a person approves." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.bg{fill:#F2F3EE}
.n{fill:#F2F3EE;stroke:#4A524D;stroke-width:1.2}.n2{fill:#E9EBE4;stroke:#737B76;stroke-width:1}
.nacc{fill:#EDE6D2;stroke:#A97B1F;stroke-width:1.6}.ndash{fill:#F2F3EE;stroke:#737B76;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1C221F;font-family:Georgia,'Times New Roman',serif;font-size:13px}.tb{font-weight:600}
.tm{fill:#737B76;font-family:Menlo,Consolas,monospace;font-size:11px}.tacc{fill:#7E5A12}
.ln{stroke:#4A524D;stroke-width:1.2;fill:none}.lnacc{stroke:#A97B1F;stroke-width:1.8;fill:none}.bus{stroke:#A97B1F;stroke-width:2.4;fill:none}
.mk{fill:#4A524D}.mkacc{fill:#A97B1F}
</style><rect class="bg" x="0" y="0" width="330" height="230"/>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<rect x="8" y="22" width="100" height="44" rx="3" class="n"/><text x="58.0" y="48.0" class="t tb" text-anchor="middle" font-size="12">Ticket system</text>
<rect x="120" y="22" width="96" height="44" rx="3" class="nacc"/><text x="168.0" y="48.0" class="t tb" text-anchor="middle" font-size="12">Record</text>
<rect x="232" y="22" width="90" height="44" rx="3" class="n"/><text x="277.0" y="48.0" class="t tb" text-anchor="middle" font-size="12">Person</text>
<rect x="120" y="152" width="96" height="44" rx="3" class="n"/><text x="168.0" y="178.0" class="t tb" text-anchor="middle" font-size="12">Agents</text>
<line x1="108" y1="38" x2="118" y2="38" class="ln" marker-end="url(#a3)"/><line x1="120" y1="52" x2="110" y2="52" class="ln" marker-end="url(#a3)"/>
<text x="60" y="86" class="tm" font-size="10" text-anchor="middle">opens a case ·</text><text x="60" y="100" class="tm" font-size="10" text-anchor="middle">gets result + audit link</text>
<line x1="232" y1="44" x2="218" y2="44" class="ln" marker-end="url(#a3)"/><text x="277" y="86" class="tm" font-size="10" text-anchor="middle">approves</text>
<line x1="168" y1="152" x2="168" y2="68" class="ln" marker-end="url(#a3)"/><text x="176" y="115" class="tm" font-size="10">pull / report (MCP)</text>
</svg>
