<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-label="The 2026 agent stack as six layers with the system of record in the middle; a bus on the right shows what each layer exchanges with the record." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.bg{fill:#F2F3EE}
.n{fill:#F2F3EE;stroke:#4A524D;stroke-width:1.2}.n2{fill:#E9EBE4;stroke:#737B76;stroke-width:1}
.nacc{fill:#EDE6D2;stroke:#A97B1F;stroke-width:1.6}.ndash{fill:#F2F3EE;stroke:#737B76;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1C221F;font-family:Georgia,'Times New Roman',serif;font-size:13px}.tb{font-weight:600}
.tm{fill:#737B76;font-family:Menlo,Consolas,monospace;font-size:11px}.tacc{fill:#7E5A12}
.ln{stroke:#4A524D;stroke-width:1.2;fill:none}.lnacc{stroke:#A97B1F;stroke-width:1.8;fill:none}.bus{stroke:#A97B1F;stroke-width:2.4;fill:none}
.mk{fill:#4A524D}.mkacc{fill:#A97B1F}
</style><rect class="bg" x="0" y="0" width="820" height="470"/>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<defs><marker id="a1acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkacc"/></marker></defs>
<line x1="556" y1="45" x2="556" y2="415" class="bus"/>
<rect x="16" y="16" width="520" height="58" rx="3" class="n"/>
<text x="32" y="40" class="t tb">Governance and inventory</text>
<text x="32" y="60" class="tm">Agent 365 · ServiceNow Control Tower</text>
<line x1="556" y1="45" x2="538" y2="45" class="ln" marker-end="url(#a1)"/>
<text x="572" y="41" class="tm">record → answers: which agent did</text>
<text x="572" y="58" class="tm">what, checked by whom, at what cost</text>
<rect x="16" y="90" width="520" height="58" rx="3" class="n"/>
<text x="32" y="114" class="t tb">Identity and permissions</text>
<text x="32" y="134" class="tm">Okta for AI Agents · Entra Agent ID · AgentCore Identity</text>
<line x1="536" y1="119" x2="554" y2="119" class="ln" marker-end="url(#a1)"/>
<text x="572" y="115" class="tm">→ record: asserts who this agent</text>
<text x="572" y="132" class="tm">or person is</text>
<rect x="16" y="164" width="520" height="58" rx="3" class="nacc"/>
<text x="32" y="188" class="t tb tacc">System of record for agent work</text>
<text x="32" y="208" class="tm">case → task → claim · owner · evidence · check · approval · cost</text>
<line x1="536" y1="193" x2="556" y2="193" class="lnacc"/>
<circle cx="556" cy="193" r="5" class="mkacc"/>
<text x="572" y="189" class="tm">the layer this page is about:</text>
<text x="572" y="206" class="tm">claim-level, across vendors and people</text>
<rect x="16" y="238" width="520" height="58" rx="3" class="n"/>
<text x="32" y="262" class="t tb">Durable execution</text>
<text x="32" y="282" class="tm">Temporal · Inngest · Restate · DBOS</text>
<line x1="536" y1="267" x2="556" y2="267" class="ln" stroke-dasharray="3 3"/>
<text x="572" y="263" class="tm">hosts the long-running steps;</text>
<text x="572" y="280" class="tm">the record holds the claim, not the retry</text>
<rect x="16" y="312" width="520" height="58" rx="3" class="n"/>
<text x="32" y="336" class="t tb">Gateways and tracing</text>
<text x="32" y="356" class="tm">LiteLLM · Langfuse · Braintrust</text>
<line x1="556" y1="341" x2="538" y2="341" class="ln" marker-end="url(#a1)"/>
<text x="572" y="337" class="tm">record → emits one event</text>
<text x="572" y="354" class="tm">per transition</text>
<rect x="16" y="386" width="520" height="58" rx="3" class="n"/>
<text x="32" y="410" class="t tb">Workers</text>
<text x="32" y="430" class="tm">Claude Code · Codex · Gemini CLI · Perplexity Agent API</text>
<line x1="536" y1="415" x2="554" y2="415" class="ln" marker-end="url(#a1)"/>
<text x="572" y="411" class="tm">→ record: pull tasks, report</text>
<text x="572" y="428" class="tm">claims and evidence over MCP</text>
</svg>
